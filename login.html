<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card auth-card shadow-lg p-4">
    <h2 class="mb-4 text-center fw-bold">Sign In</h2>
    <div id="login-msg" class="mb-2"></div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" id="username" class="form-control" placeholder="johndoe"/>
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••"/>
    </div>
    <button id="login-btn" class="btn btn-primary w-100 mb-3">Login</button>
    <p class="text-center mb-0">No account yet? <a href="register.html">Register</a></p>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
