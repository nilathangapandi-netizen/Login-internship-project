<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-lg p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">My Profile</h2>
            <button id="logout-btn" class="btn btn-outline-danger btn-sm">Logout</button>
          </div>
          <div id="profile-msg" class="mb-3"></div>

          <!-- Account Info (read-only from MySQL) -->
          <h5 class="text-muted mb-3">Account Information</h5>
          <div class="row mb-4">
            <div class="col-md-6 mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" id="acc-name" class="form-control" disabled/>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Username</label>
              <input type="text" id="acc-username" class="form-control" disabled/>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="acc-email" class="form-control" disabled/>
            </div>
          </div>

          <!-- Profile Details (editable, stored in MongoDB) -->
          <h5 class="text-muted mb-3">Profile Details</h5>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Age</label>
              <input type="number" id="age" class="form-control" placeholder="25"/>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Date of Birth</label>
              <input type="date" id="dob" class="form-control"/>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Contact Number</label>
              <input type="tel" id="contact" class="form-control" placeholder="+1 555 000 0000"/>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">City</label>
              <input type="text" id="city" class="form-control" placeholder="New York"/>
            </div>
            <div class="col-12 mb-3">
              <label class="form-label">Bio</label>
              <textarea id="bio" class="form-control" rows="3" placeholder="Tell us about yourself..."></textarea>
            </div>
          </div>
          <button id="save-btn" class="btn btn-primary">Save Profile</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
